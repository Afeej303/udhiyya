name: Deploy Udhiyya Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: udhiyya-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Trigger backend deploy on Render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Request deployment for this commit
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?Set the Render deploy hook secret}"
          curl --fail --silent --show-error --output /dev/null \
            --request POST --url-query "ref=$GITHUB_SHA" \
            "$RENDER_DEPLOY_HOOK_URL"
